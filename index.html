<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fold3D Demo</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
    }

    #logo {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    #subtitle {
      color: #aaaaaa;
      margin-bottom: 35px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    #startButton {
      padding: 16px 36px;
      border-radius: 50px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      background: white;
      color: black;
      cursor: pointer;
    }

    #overlay-ui {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 20;
      pointer-events: auto;
    }

    .ui-btn {
      background: rgba(255,255,255,0.9);
      color: black;
      border: none;
      border-radius: 40px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #progress-box {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 220px;
      background: rgba(0,0,0,0.55);
      border-radius: 20px;
      padding: 12px;
      color: white;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    #progress-title {
      font-size: 13px;
      margin-bottom: 8px;
      color: #dddddd;
      letter-spacing: 1px;
    }

    #progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      overflow: hidden;
    }

    #progress-fill {
      width: 42%;
      height: 100%;
      background: white;
      border-radius: 20px;
    }

    #progress-text {
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- START SCREEN -->
  <div id="start-screen">
    <div id="logo">FOLD3D</div>
    <div id="subtitle">REAL ESTATE AR DEMO</div>
    <button id="startButton">START EXPERIENCE</button>
  </div>

  <!-- UI -->
  <div id="progress-box">
    <div id="progress-title">PROJECT PROGRESS</div>

    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <div id="progress-text">42%</div>
  </div>

  <div id="overlay-ui">
    <button class="ui-btn">VIEW PLANS</button>
    <button class="ui-btn">SITE UPDATE</button>
  </div>

  <!-- AR SCENE -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      filterMinCF: 0.01;
      filterBeta: 0.001;
      missTolerance: 5;
      warmupTolerance: 5;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>

      <!-- PNG IMAGE -->
      <!-- replace project.png with your render image -->
      <img id="projectImage" src="./project.png" />

    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- SIMPLE LIGHT -->
      <a-light type="ambient" intensity="1.2"></a-light>

      <!-- FLOATING PROJECT IMAGE -->
      <a-plane
        src="#projectImage"
        position="0 0 0"
        width="1"
        height="0.62"
        material="transparent: true;"
        animation="
          property: position;
          to: 0 0.03 0;
          dir: alternate;
          dur: 2500;
          loop: true;
          easing: easeInOutSine;
        "
      >
      </a-plane>

      <!-- TITLE -->
      <a-text
        value="GYURJYAN CASCADE"
        position="0 -0.45 0"
        align="center"
        width="2"
        color="white"
      ></a-text>

    </a-entity>

  </a-scene>

  <script>
    const startButton = document.querySelector('#startButton');
    const startScreen = document.querySelector('#start-screen');
    const sceneEl = document.querySelector('a-scene');

    startButton.addEventListener('click', async () => {

      startScreen.style.display = 'none';

      const mindarSystem = sceneEl.systems["mindar-image-system"];

      await mindarSystem.start();

    });
  </script>

</body>
</html>
