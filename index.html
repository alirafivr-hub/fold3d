<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fold3D Media - Final Stable Build</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background-color: #000; }
      /* لایه شروع برای اجازه دسترسی دوربین در گوشی */
      #start-screen {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.95); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      button {
        padding: 15px 40px; font-size: 18px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 50px;
        color: black; font-weight: bold; box-shadow: 0 0 20px #00ffff;
        transition: 0.3s;
      }
      button:active { transform: scale(0.9); }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h1 style="color: #00ffff; margin-bottom: 10px;">FOLD3D</h1>
      <p style="margin-bottom: 25px; color: #aaa;">Architectural Hologram System</p>
      <button id="startButton">ACTIVATE EXPERIENCE</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF:0.0001; filterBeta: 10; missTolerance: 20; warmupTolerance: 10;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="buildingModel" src="./test.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="0 5 5" intensity="1"></a-light>

        <a-gltf-model src="#buildingModel" position="0 0 0.15" scale="0.01 0.01 0.01" rotation="0 0 0"
                      animation="property: rotation; to: 0 360 0; dur: 15000; easing: linear; loop: true">
        </a-gltf-model>

        <a-sphere position="-0.4 0.5 0.2" radius="0.06" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 3"></a-sphere>
        <a-text value="INFO" position="-0.4 0.65 0.2" align="center" width="2.5" color="#00ffff"></a-text>

        <a-sphere position="0.4 0.5 0.2" radius="0.06" material="color: #ff5733; emissive: #ff5733; emissiveIntensity: 3"></a-sphere>
        <a-text value="CALL" position="0.4 0.65 0.2" align="center" width="2.5" color="#ff5733"></a-text>
      </a-entity>

    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const startScreen = document.querySelector('#start-screen');
      const sceneEl = document.querySelector('a-scene');

      startButton.addEventListener('click', () => {
        startScreen.style.display = 'none';
        sceneEl.systems['mindar-image-system'].start();
      });
    </script>
  </body>
</html>
