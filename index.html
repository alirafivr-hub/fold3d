<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fold3D - AR Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #start-screen {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999; font-family: Arial, sans-serif;
      }
      button {
        padding: 15px 40px; font-size: 20px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 8px; color: black;
        font-weight: bold; text-transform: uppercase; margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h2 style="color: #00ffff; margin-bottom: 5px;">Fold3D Media</h2>
      <p>System Initializing...</p>
      <button id="startButton">Start AR</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <a-light type="ambient" color="#FFFFFF" intensity="1.2"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1" position="-0.5 1 1"></a-light>

        <a-box position="0 0 0.1" scale="0.3 0.3 0.3" material="color: #0077ff; opacity: 0.9; transparent: true"></a-box>

        <a-sphere position="-0.5 0.5 0.2" radius="0.08" material="color: #00ffff; opacity: 0.7; transparent: true; emissive: #00ffff; emissiveIntensity: 2"
                  animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; dur: 800; loop: true"></a-sphere>
        <a-text value="INFO" position="-0.5 0.7 0.2" align="center" width="2" color="#00ffff"></a-text>

        <a-sphere position="0.5 0.5 0.2" radius="0.08" material="color: #ff5733; opacity: 0.7; transparent: true; emissive: #ff5733; emissiveIntensity: 2"
                  animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; dur: 800; delay: 400; loop: true"></a-sphere>
        <a-text value="CALL" position="0.5 0.7 0.2" align="center" width="2" color="#ff5733"></a-text>

      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const startScreen = document.querySelector('#start-screen');
      const sceneEl = document.querySelector('a-scene');

      startButton.addEventListener('click', () => {
        startScreen.style.display = 'none';
        sceneEl.systems['mindar-image-system'].start();
      });
    </script>
  </body>
</html>
