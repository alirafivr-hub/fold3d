<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #start-screen {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999;
      }
      button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #00ffff; border: none; border-radius: 50px; }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <button id="startButton">START EXPERIENCE</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF:0.0001; filterBeta: 0.001; missTolerance: 15; warmupTolerance: 7;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="buildingModel" src="./test.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-light type="ambient" intensity="1"></a-light>
        <a-light type="directional" position="0 2 2" intensity="0.5"></a-light>

        <a-gltf-model src="#buildingModel" position="0 0 0.1" scale="0.05 0.05 0.05" rotation="0 0 0"></a-gltf-model>

        <a-sphere position="-0.5 0.5 0.2" radius="0.07" material="color: #00ffff; opacity: 0.8; transparent: true"></a-sphere>
        <a-text value="INFO" position="-0.5 0.65 0.2" align="center" width="2.5"></a-text>

        <a-sphere position="0.5 0.5 0.2" radius="0.07" material="color: #ff5733; opacity: 0.8; transparent: true"></a-sphere>
        <a-text value="CALL" position="0.5 0.65 0.2" align="center" width="2.5"></a-text>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const startScreen = document.querySelector('#start-screen');
      const sceneEl = document.querySelector('a-scene');
      startButton.addEventListener('click', () => {
        startScreen.style.display = 'none';
        sceneEl.systems['mindar-image-system'].start();
      });
    </script>
  </body>
</html>
