<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fold3D - Holographic Stable Build</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #000; }
      #start-screen {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.95); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
      }
      button { padding: 15px 40px; font-size: 18px; cursor: pointer; background: #00ffff; border: none; border-radius: 50px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h1 style="color: #00ffff;">FOLD3D</h1>
      <button id="startButton">ACTIVATE AR</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF:0.0001; filterBeta: 10; missTolerance: 20;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="buildingModel" src="./test.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-light type="ambient" intensity="1.8" color="#ffffff"></a-light>
        <a-light type="directional" position="1 5 3" intensity="1" castShadow="true"></a-light>

        <a-gltf-model src="#buildingModel" position="0 0 0.1" scale="0.008 0.008 0.008" rotation="0 0 0"></a-gltf-model>

        <a-sphere position="-0.4 0.6 0.15" radius="0.07" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 2; opacity: 0.9; transparent: true"></a-sphere>
        <a-text value="INFO" position="-0.4 0.75 0.15" align="center" width="2.5" color="white"></a-text>

        <a-sphere position="0.4 0.6 0.15" radius="0.07" material="color: #ff5733; emissive: #ff5733; emissiveIntensity: 2; opacity: 0.9; transparent: true"></a-sphere>
        <a-text value="CALL" position="0.4 0.75 0.15" align="center" width="2.5" color="white"></a-text>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const startScreen = document.querySelector('#start-screen');
      const sceneEl = document.querySelector('a-scene');
      startButton.addEventListener('click', () => {
        startScreen.style.display = 'none';
        sceneEl.systems['mindar-image-system'].start();
      });
    </script>
  </body>
</html>
